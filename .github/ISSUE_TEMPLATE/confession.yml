name: Confession
description: A Git or AI fuck-up of your own, for the daily search. Public, so leave out secrets and names.
title: "Confession: "
labels: ["confession"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public, so everyone can read it. Before you post, take out keys, tokens, passwords, internal URLs and the names of anyone who didn't agree to be in it.
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, or what the agent ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: A link
      description: An issue, a post, a commit. Optional.

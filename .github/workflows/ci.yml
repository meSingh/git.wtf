# Build and the old-URL check. Deploys are not done here: Cloudflare Workers Builds watches the
# repository and runs `npm run build` then `npx wrangler deploy` on every push to master, and
# `wrangler versions upload` (a preview URL) for other branches.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Build and check old URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke build from the fixtures (templates, share images, converter)
        run: npm run build:fixture
      - name: No fixture content in the real folders
        run: '! grep -rl "^fixture: true" incidents archive'
      - run: npm run build
      - name: Serve the build like Cloudflare does
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
      - run: node scripts/check-urls.mjs http://127.0.0.1:8787
      - if: failure()
        run: cat wrangler.log
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

